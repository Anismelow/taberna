<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>TPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

	<header th:replace="~{includes/plantilla :: cabecera}"></header>
	<nav th:replace="~{includes/plantilla :: menu}"></nav>

	<main class="tpv-main">
		<h2>TPV — Punto de venta</h2>

		<!-- ===== MENSAJE (ticket guardado, error...) ===== -->
		<div class="mensaje-flash" th:if="${f_mensaje}" th:text="${f_mensaje}">Mensaje</div>

		<div class="tpv-layout">

			<!-- ===== COLUMNA IZQUIERDA: el ticket ===== -->
			<section class="tpv-ticket">
				<h3>Ticket</h3>

				<!-- si el carrito está vacío -->
				<p class="ticket-vacio" th:if="${carrito.isEmpty()}">
					El ticket está vacío. Añade productos desde la derecha.
				</p>

				<!-- si tiene líneas, las pintamos -->
				<div th:unless="${carrito.isEmpty()}">

					<!-- Formato: 5 – Café con leche (1.90) = 9.50 € ❌ -->
					<div class="ticket-linea" th:each="linea : ${carrito.values()}">
						<span class="linea-cant" th:text="${linea.cantidad}">1</span>
						<span>–</span>
						<span class="linea-nombre" th:text="${linea.productoFK.nombre}">Producto</span>
						<span class="linea-precio"
							  th:text="'(' + ${#numbers.formatDecimal(linea.productoFK.precioConIva, 1, 2)} + ')'">(0.00)</span>
						<span class="linea-subtotal"
							  th:text="'= ' + ${#numbers.formatDecimal(linea.productoFK.precioConIva * linea.cantidad, 1, 2)} + ' €'">= 0.00 €</span>
						<a class="linea-borrar"
						   th:href="@{/tpvQuitar(productoId=${linea.productoFK.id})}"
						   title="Quitar esta línea">❌</a>
					</div>

					<!-- ===== TOTAL ===== -->
					<div class="ticket-total">
						<span>TOTAL</span>
						<strong th:text="${#numbers.formatDecimal(totalTicket, 1, 2)} + ' €'">0.00 €</strong>
					</div>

					<!-- ===== BOTONES ===== -->
					<div class="ticket-botones">
						<a class="btn btn-cancelar" th:href="@{/tpvCancelar}">Cancelar</a>

						<form method="post" th:action="@{/tpvGuardar}">
							<button type="submit" class="btn btn-ok">OK</button>
						</form>
					</div>

				</div>
			</section>

			<!-- ===== COLUMNA DERECHA: los productos ===== -->
			<section class="tpv-productos">

				<!-- un bloque por cada categoría -->
				<div th:each="categoria : ${listaCategorias}" class="categoria-bloque">
					<h3 th:text="${categoria.nombre}">Categoría</h3>

					<div class="productos-grid">

						<!-- solo los productos de esta categoría -->
						<div th:each="producto : ${listaProductos}"
							 th:if="${producto.categoriaFK.id == categoria.id}"
							 class="producto-card">

							<img th:src="@{'/image/' + ${producto.foto}}" alt="foto">
							<p class="producto-nombre" th:text="${producto.nombre}">Producto</p>
							<p class="producto-precio" th:text="${producto.precioConIva} + ' €'">0.00 €</p>

							<form method="post" th:action="@{/tpvAnadir}">
								<input type="hidden" name="productoId" th:value="${producto.id}">
								<input type="number" name="cantidad" value="1" min="1">
								<button type="submit">Añadir</button>
							</form>
						</div>

					</div>
				</div>

			</section>

		</div>
	</main>

	<footer th:replace="~{includes/plantilla :: pie}"></footer>

</body>
</html>
