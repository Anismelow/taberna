<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>TPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

	<header th:replace="~{includes/plantilla :: cabecera}"></header>
	<nav th:replace="~{includes/plantilla :: menu}"></nav>

		<main>
		<h2>Copia de seguridad</h2>

		<div class="copia-panel">
			<div class="copia-info">
				<span class="copia-icono">🗄️</span>
				<div>
					<h3>Exportar datos</h3>
					<p>Descarga una copia completa de la base de datos en formato SQL.
					   Podrás usarla para restaurar los datos si fuera necesario.</p>
				</div>
			</div>

			<form th:action="@{/exportarCopia}" method="get">
				<button type="submit" class="btn-descargar">⬇ Descargar copia (.sql)</button>
			</form>
		</div>
	</main>

	<footer th:replace="~{includes/plantilla :: pie}"></footer>

</body>
</html>
